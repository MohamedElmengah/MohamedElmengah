  <g transform="translate(34, 62)">
    <text x="0" y="0" class="title">Hi, I'm Mohamed Elmengah 👋</text>
    <text x="0" y="28" class="subtitle">Agentic AI &amp; Machine Learning Engineer | CS Senior</text>
    <text x="0" y="64" class="tagline">&gt; Architecting multi-agent systems &amp; RAG workflows</text>
    <text x="0" y="86" class="tagline">&gt; Researching LLM &amp; RAG prompt-injection defense</text>
    <text x="0" y="108" class="tagline">&gt; Space: Late-night builds &amp; autonomous agents</text>
