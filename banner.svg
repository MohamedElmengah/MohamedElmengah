<svg width="850" height="250" viewBox="0 0 850 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131f" />
      <stop offset="55%" stop-color="#181b2c" />
      <stop offset="100%" stop-color="#1f2338" />
    </linearGradient>

    
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#bb9af7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#181b2c" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e64" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181b2c" stop-opacity="0" />
    </radialGradient>

    <style>
      .title { font: 700 25px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f9fa; }
      .subtitle { font: 600 14.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7aa2f7; }
      .tagline { font: 400 12.5px 'Consolas', monospace; fill: #a9b1d6; }
      .sticker-txt { font: 700 9px 'Consolas', monospace; fill: #1a1b26; }

      .node-pulse {
        animation: pulse 2s ease-in-out infinite alternate;
      }
      .n2 { animation-delay: 0.6s; }
      .n3 { animation-delay: 1.2s; }
      @keyframes pulse {
        0% { opacity: 0.4; r: 2.5; }
        100% { opacity: 1; r: 3.8; }
      }

      .steam {
        stroke: #c0caf5;
        stroke-width: 1.3;
        fill: none;
        stroke-linecap: round;
        animation: rise 2.8s ease-in-out infinite;
      }
      .s2 { animation-delay: 1.2s; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        40% { opacity: 0.55; }
        100% { transform: translateY(-14px); opacity: 0; }
      }

      .star {
        fill: #e0af68;
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      .st2 { animation-delay: 1.5s; }
      @keyframes twinkle {
        0% { opacity: 0.25; }
        100% { opacity: 0.95; }
      }

      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  
  <rect width="850" height="250" rx="14" fill="url(#roomWall)" stroke="#2f334d" stroke-width="1.5" />

  
  <rect x="1.5" y="212" width="847" height="36.5" rx="6" fill="#0d0f18" />
  <line x1="435" y1="212" x2="848" y2="212" stroke="#292e42" stroke-width="1.5" />

  
  <g transform="translate(445, 0)">
    
    
    <g transform="translate(22, 24)">
      <rect width="82" height="78" rx="5" fill="#090b12" stroke="#3b4261" stroke-width="2.5" />
      <line x1="41" y1="0" x2="41" y2="78" stroke="#3b4261" stroke-width="2" />
      <line x1="0" y1="39" x2="82" y2="39" stroke="#3b4261" stroke-width="2" />
      <circle cx="62" cy="18" r="7" fill="#e0af68" opacity="0.85" />
      <circle cx="65" cy="16" r="6" fill="#090b12" />
      <circle cx="18" cy="20" r="1.4" class="star" />
      <circle cx="28" cy="55" r="1.2" class="star st2" />
      <circle cx="60" cy="60" r="1.5" class="star" />
    </g>

    
    <g transform="translate(12, 132)">
      <rect x="0" y="10" width="12" height="70" rx="3" fill="#292e42" />
      <rect x="128" y="32" width="10" height="48" rx="3" fill="#292e42" />
      <rect x="12" y="38" width="116" height="24" rx="4" fill="#24283b" />
      <rect x="16" y="28" width="28" height="12" rx="6" fill="#c0caf5" opacity="0.85" />
      <path d="M42,36 L124,36 Q128,36 128,42 L128,62 L42,62 Z" fill="#3d59a1" />
      <line x1="58" y1="36" x2="58" y2="62" stroke="#2ac3de" stroke-width="2" opacity="0.5" />
      <rect x="10" y="60" width="120" height="12" rx="2" fill="#1f2335" />
    </g>

    
    
    <g transform="translate(175, 32) rotate(-6)">
      <rect width="46" height="28" rx="4" fill="#ff9e64" />
      <text x="7" y="13" class="sticker-txt">AGENTIC</text>
      <text x="15" y="23" class="sticker-txt">AI //</text>
    </g>

    
    <g transform="translate(232, 24) rotate(5)">
      <rect width="38" height="38" rx="8" fill="#bb9af7" />
      <polygon points="10,14 12,7 17,12" fill="#1a1b26" />
      <polygon points="28,14 26,7 21,12" fill="#1a1b26" />
      <circle cx="19" cy="21" r="9" fill="#1a1b26" />
      <circle cx="16" cy="20" r="1.5" fill="#7dcfff" />
      <circle cx="22" cy="20" r="1.5" fill="#7dcfff" />
      <path d="M17,24 Q19,26 21,24" stroke="#ff9e64" stroke-width="1.2" fill="none" />
    </g>

    
    <g transform="translate(282, 36) rotate(-4)">
      <rect width="44" height="22" rx="4" fill="#7dcfff" />
      <text x="9" y="14" class="sticker-txt">[RAG]</text>
    </g>

    
    <rect x="172" y="76" width="188" height="5" rx="2" fill="#2f334d" />
    
    <rect x="338" y="62" width="14" height="14" rx="2" fill="#e0af68" />
    <circle cx="345" cy="58" r="7" fill="#9ece6a" />
    <circle cx="340" cy="60" r="5" fill="#73daca" />

    
    <circle cx="265" cy="135" r="75" fill="url(#screenGlow)" />
    <circle cx="355" cy="125" r="55" fill="url(#lampGlow)" />

    <rect x="165" y="156" width="215" height="8" rx="3" fill="#2f334d" />
    <rect x="175" y="164" width="7" height="48" fill="#1f2335" />
    <rect x="363" y="164" width="7" height="48" fill="#1f2335" />

    <rect x="235" y="142" width="44" height="36" rx="8" fill="#1a1b26" stroke="#414868" stroke-width="2" />
    <rect x="253" y="178" width="8" height="26" fill="#292e42" />
    <line x1="238" y1="206" x2="276" y2="206" stroke="#414868" stroke-width="3" stroke-linecap="round" />

    
    <g transform="translate(215, 106)">
      <rect x="6" y="0" width="84" height="48" rx="4" fill="#0f111a" stroke="#565f89" stroke-width="2" />
      <line x1="22" y1="16" x2="46" y2="26" stroke="#7aa2f7" stroke-width="1.2" />
      <line x1="46" y1="26" x2="72" y2="14" stroke="#bb9af7" stroke-width="1.2" />
      <line x1="46" y1="26" x2="70" y2="36" stroke="#7dcfff" stroke-width="1.2" />
      
      <circle cx="22" cy="16" r="3" fill="#ff9e64" class="node-pulse" />
      <circle cx="46" cy="26" r="3.5" fill="#7aa2f7" class="node-pulse n2" />
      <circle cx="72" cy="14" r="3" fill="#9ece6a" class="node-pulse n3" />
      <circle cx="70" cy="36" r="3" fill="#bb9af7" class="node-pulse" />

      <rect x="14" y="34" width="22" height="2.5" rx="1" fill="#7dcfff" opacity="0.7" />
      <rect x="14" y="39" width="14" height="2.5" rx="1" fill="#9ece6a" opacity="0.7" />
      <rect x="30" y="39" width="4" height="2.5" fill="#f8f9fa" class="cursor-blink" />

      <rect x="0" y="48" width="96" height="4" rx="2" fill="#7aa2f7" />
    </g>

    
    <g transform="translate(185, 141)">
      <rect x="0" y="3" width="12" height="12" rx="2" fill="#f7768e" />
      <path d="M12,5 Q16,5 16,9 Q16,13 12,13" fill="none" stroke="#f7768e" stroke-width="1.8" />
      <path d="M4,0 Q2,-5 5,-9" class="steam" />
      <path d="M9,0 Q11,-5 8,-9" class="steam s2" />
    </g>

    
    <g transform="translate(335, 114)">
      <rect x="8" y="38" width="18" height="4" rx="2" fill="#414868" />
      <line x1="17" y1="38" x2="22" y2="16" stroke="#565f89" stroke-width="2.5" />
      <line x1="22" y1="16" x2="10" y2="8" stroke="#565f89" stroke-width="2.5" />
      <polygon points="4,12 16,4 20,14" fill="#ff9e64" />
